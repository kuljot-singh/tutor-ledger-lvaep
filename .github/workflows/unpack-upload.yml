name: Unpack uploaded project

on:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find uploaded ZIP
        id: findzip
        shell: bash
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -ne 1 ]; then
            echo "Expected exactly one ZIP at repository root; found ${#zips[@]}."
            exit 1
          fi
          echo "zip=${zips[0]}" >> "$GITHUB_OUTPUT"

      - name: Extract project into repository root
        shell: bash
        run: |
          ZIP="${{ steps.findzip.outputs.zip }}"
          TMP_DIR="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP_DIR"

          # Copy the extracted project, including hidden files, into the repo root.
          rsync -a --exclude=".git" "$TMP_DIR"/ ./

          rm -f "$ZIP"
          rm -rf "$TMP_DIR"

          # One-time helper: remove this workflow after successful extraction.
          rm -f .github/workflows/unpack-upload.yml

      - name: Verify expected project files
        shell: bash
        run: |
          test -f README.md
          test -f package.json
          test -d app
          test -d lib
          test -d db
          test -d tests

      - name: Commit extracted project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Tutor Ledger source"
          git push
